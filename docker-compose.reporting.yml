services:
  portal-reporting-db:
    image: postgres:17-alpine
    container_name: anphu-portal-reporting
    restart: unless-stopped
    environment:
      POSTGRES_DB: patient_portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal-local-change-me
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - portal_reporting_data:/var/lib/postgresql/data
      - ./docs/sql/portal_schema_draft.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d patient_portal"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  portal_reporting_data:
